---
# Read-only. Findings carry fixable: true when remediation can fix them.
- name: audit | Locate sudo
  ansible.builtin.stat:
    path: /usr/bin/sudo
  register: __sudo_hardening_bin

- name: audit | Inspect the configuration
  when: __sudo_hardening_bin.stat.exists
  block:
    - name: audit | Validate the complete configuration
      ansible.builtin.command: visudo -c
      register: __sudo_hardening_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: audit | Check that the drop-in directory is included
      ansible.builtin.include_tasks: check_include.yml

    - name: audit | Look at the drop-in
      ansible.builtin.stat:
        path: "{{ linux_hardening_sudo_dropin_dir }}/{{ linux_hardening_sudo_dropin_name }}"
      register: __sudo_hardening_file

    - name: audit | Read the drop-in
      ansible.builtin.slurp:
        src: "{{ linux_hardening_sudo_dropin_dir }}/{{ linux_hardening_sudo_dropin_name }}"
      register: __sudo_hardening_content
      when: __sudo_hardening_file.stat.exists

    - name: audit | Look for passwordless sudo rules
      ansible.builtin.command:
        argv:
          - grep
          - -rnE
          - '^[^#]*(NOPASSWD|!authenticate)'
          - "{{ linux_hardening_sudo_main_file }}"
          - "{{ linux_hardening_sudo_dropin_dir }}"
      register: __sudo_hardening_nopw
      changed_when: false
      failed_when: __sudo_hardening_nopw.rc > 1
      check_mode: false

- name: audit | Record findings
  ansible.builtin.set_fact:
    linux_hardening_sudo_findings: >-
      {{ __sudo_hardening_missing_sudo
         if not __sudo_hardening_bin.stat.exists
         else __sudo_hardening_invalid_config + __sudo_hardening_missing_include
              + __sudo_hardening_bad_dropin + __sudo_hardening_passwordless }}
  vars:
    __sudo_hardening_missing_sudo:
      - {key: sudo, expected: installed, actual: missing, fixable: true}
    __sudo_hardening_invalid_config: >-
      {{ [] if __sudo_hardening_check.rc == 0 else [{
           'key': 'visudo -c', 'expected': 'valid configuration', 'fixable': false,
           'actual': __sudo_hardening_check.stderr_lines | default([]) | first | default('error')}] }}
    __sudo_hardening_missing_include: >-
      {{ [] if __sudo_hardening_inc.rc == 0 else [{
           'key': 'includedir ' ~ linux_hardening_sudo_dropin_dir, 'actual': 'missing', 'fixable': true,
           'expected': 'present in ' ~ linux_hardening_sudo_main_file}] }}
    __sudo_hardening_dropin_ok: >-
      {{ __sudo_hardening_file.stat.exists
         and __sudo_hardening_file.stat.mode == '0440'
         and __sudo_hardening_file.stat.pw_name == 'root'
         and (__sudo_hardening_content.content | b64decode)
             == lookup('ansible.builtin.template', 'sudoers_dropin.j2') }}
    __sudo_hardening_bad_dropin: >-
      {{ [] if __sudo_hardening_dropin_ok else [{
           'key': 'drop-in ' ~ linux_hardening_sudo_dropin_name, 'fixable': true,
           'expected': 'present with the hardened Defaults', 'actual': 'missing or different'}] }}
    # One finding per NOPASSWD / !authenticate line; a human has to decide, so never fixable.
    # Builds a list of {key, expected, actual, fixable}: grep lines -> prefixed keys -> dict -> list of dicts.
    __sudo_hardening_passwordless: >-
      {{ [] if linux_hardening_sudo_allow_nopasswd | bool else
         dict(__sudo_hardening_nopw.stdout_lines
              | map('regex_replace', '^', 'passwordless sudo: ')
              | zip_longest([], fillvalue='NOPASSWD or !authenticate'))
         | dict2items(value_name='actual')
         | map('combine', {'expected': 'password required', 'fixable': false})
         | list }}

- name: audit | Report sudo_hardening result
  ansible.builtin.debug:
    msg: "{{ 'COMPLIANT' if linux_hardening_sudo_findings | length == 0 else linux_hardening_sudo_findings }}"

# Verify after remediation: only fixable findings are fatal, the rest need a human.
# Plain audit: every finding is fatal when linux_hardening_fail_on_error is set.
- name: audit | Fail on findings
  ansible.builtin.fail:
    msg: "sudo_hardening found {{ __sudo_hardening_blocking | length }} deviation(s)."
  vars:
    __sudo_hardening_blocking: >-
      {{ linux_hardening_sudo_findings | selectattr('fixable') | list
         if __sudo_hardening_audit_fatal | default(false)
         else (linux_hardening_sudo_findings if linux_hardening_fail_on_error | bool else []) }}
  when: __sudo_hardening_blocking | length > 0
